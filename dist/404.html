<!DOCTYPE html>

<head>

<script>
try {
  var savedTheme = JSON.parse(localStorage.getItem('plib.theme.v1'));
  if (savedTheme === 'light' || savedTheme === 'dark') {
    document.documentElement.setAttribute('data-theme', savedTheme);
  }
  var savedLanguage = JSON.parse(localStorage.getItem('plib.lang.v1'));
  if (savedLanguage === 'en') document.documentElement.setAttribute('lang', 'en');
} catch (e) { /* 使用默认暗色主题与中文 */ }
</script>
<style>
  :root {
    color-scheme: dark;
    --bg: #111111; --bg-elev: #181818; --bg-card: #1b1b1b; --bg-input: #141414;
    --line: #303030; --line-soft: #262626;
    --fg: #ededed; --fg-dim: #bdbdbd; --fg-mute: #9e9e9e;
    --accent: #6ea8fe; --accent-fg: #9cc3ff; --accent-soft: rgba(110, 168, 254, .12);
    --accent-line: rgba(110, 168, 254, .28); --on-accent: #0b172a;
    --shadow: 0 18px 45px -24px rgba(0, 0, 0, .75);
    --radius: 16px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
            "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
            "Liberation Mono", "Noto Sans Mono CJK SC", monospace;
  }
  html[data-theme="light"] {
    color-scheme: light;
    --bg: #f5f6f8; --bg-elev: #ffffff; --bg-card: #ffffff; --bg-input: #ffffff;
    --line: #d4d9e0; --line-soft: #e8eaee;
    --fg: #1d2129; --fg-dim: #464d59; --fg-mute: #5c6470;
    --accent: #2f6fd0; --accent-fg: #1f5cb5; --accent-soft: rgba(47, 111, 208, .075);
    --accent-line: rgba(47, 111, 208, .22); --on-accent: #ffffff;
    --shadow: 0 18px 45px -26px rgba(31, 38, 60, .25);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background: radial-gradient(ellipse 65% 320px at 78% 0%, var(--accent-soft), transparent 72%), var(--bg);
    color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent-fg); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--accent-fg); outline-offset: 3px; }

  .box {
    width: min(460px, 100%); padding: 34px 32px 28px;
    border: 1px solid var(--line-soft); border-radius: 20px;
    background: var(--bg-card); box-shadow: var(--shadow); text-align: center;
  }
  /* 品牌标识沿用首页的图标与文字层级，让 404 也像站里的一部分 */
  .brand { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 26px; }
  .brand-mark { width: 34px; height: 34px; border-radius: 10px; overflow: hidden; box-shadow: 0 8px 22px -12px var(--accent); }
  .brand-mark img { width: 34px; height: 34px; border-radius: 10px; object-fit: cover; display: block; }
  .brand-text { display: flex; flex-direction: column; line-height: 1.25; text-align: left; }
  .brand-text strong { font-size: 16px; letter-spacing: .4px; }
  .brand-text small { margin-top: 3px; color: var(--fg-mute); font-size: 11.5px; font-weight: 600; letter-spacing: 1.2px; }
  /* 语言切换：与首页顶栏同一套按钮形态 */
  .lang-toggle {
    padding: 5px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: transparent; color: var(--fg-dim);
    font-family: inherit; font-size: 11.5px; font-weight: 650; letter-spacing: .4px;
    cursor: pointer; transition: color .15s, border-color .15s, background .15s;
  }
  .lang-toggle:hover { color: var(--accent-fg); border-color: var(--accent); background: var(--accent-soft); }

  .code {
    margin: 0 0 10px; font-size: 56px; font-weight: 650; line-height: 1.05;
    letter-spacing: -2px; color: var(--accent-fg); font-variant-numeric: tabular-nums;
  }
  h1 { margin: 0 0 10px; font-size: 20px; line-height: 1.45; font-weight: 650; }
  p { margin: 0 0 22px; color: var(--fg-dim); font-size: 14px; line-height: 1.8; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 11px 22px; border-radius: 10px; border: 1px solid transparent;
    background: var(--accent); color: var(--on-accent); font-size: 14px; font-weight: 550;
  }
  .btn:hover { background: color-mix(in srgb, var(--accent) 88%, #ffffff); text-decoration: none; }
  .btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .hints {
    display: flex; align-items: flex-start; gap: 8px; margin: 22px 0 0;
    padding: 13px 14px; border: 1px solid var(--line-soft); border-radius: 12px;
    background: var(--bg-input); color: var(--fg-mute); font-size: 13px; line-height: 1.7; text-align: left;
  }
  .hints svg { width: 15px; height: 15px; margin-top: 2px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; }
  .hints code {
    font-family: var(--mono); font-size: .9em; padding: .1em .4em; border-radius: 4px;
    background: var(--accent-soft); color: var(--accent-fg);
  }
  @media (max-width: 480px) {
    .box { padding: 28px 20px 22px; border-radius: 16px; }
    .code { font-size: 46px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }
</style>
<script async src="https://stats.guanjihuan.com/tracker/tracker.min.js" data-site-id="site_2683c2401a511931"></script>
</head>
