# prompt.guanjihuan.com — Nginx 站点配置样例
#
# 用法：
#   1. 把本文件放到 /etc/nginx/conf.d/prompt.guanjihuan.com.conf
#   2. 按注释替换 SERVER_NAME、证书路径与静态根目录
#   3. nginx -t && systemctl reload nginx
#
# 证书用 certbot 签发（DNS 生效、80 端口可达之后）：
#   certbot --nginx -d prompt.guanjihuan.com

server {
    listen 80;
    listen [::]:80;
    server_name prompt.guanjihuan.com;

    # 证书签发与跳转都在这里完成；证书就位后可以删掉这一段
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name prompt.guanjihuan.com;

    # ---- 证书（certbot 签发，路径以实际为准）----
    ssl_certificate     /etc/letsencrypt/live/prompt.guanjihuan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prompt.guanjihuan.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ---- 站点根目录：把 build.py 的产物整目录放进去 ----
    root /var/www/prompt.guanjihuan.com;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # nginx 默认压缩级别是 1，对文本几乎不压；这里是纯文本站点，提到 6 能再小 13~23%
    gzip_comp_level 6;
    gzip_types text/html text/plain text/css application/javascript application/json image/svg+xml;

    # 单页站点：真实路由只有 "/"（条目定位靠 #hash，不走服务端），
    # 其余路径一律 404，交给 error_page 落到自带的 404 页面。
    # 早先写成 try_files ... /index.html，任意路径都会拿到 200 + 首页，404 页面永远不生效。
    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 404 页面：任意不存在的路径都落到它，而不是 Nginx 默认页
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # 带版本号的静态资源可以长期缓存；HTML 每次回源确认最新。
    # 这里用 expires 而不是 add_header Cache-Control：add_header 一旦在本层出现，
    # 就会覆盖掉上层同名的安全响应头（继承规则是「本层有就不再继承」）。
    location ~* \.(?:css|js|png|svg|jpg|jpeg|webp|ico|woff2?)$ {
        expires 30d;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;    # Cache-Control: no-cache，每次回源确认最新
    }

    # 基础安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 内容安全策略：站点不加载任何外部资源，正文全部转义后渲染，
    # 因此可以禁掉外部脚本与内联脚本，只放行主题引导脚本（哈希见下）。
    # 改 src/index.html 或 src/404.html 里那段主题脚本后，哈希要跟着更新
    # （CSP 的哈希是 base64，不是十六进制）：
    #   python -c "import re,hashlib,base64;h=open('src/index.html',encoding='utf-8').read();\
    # s=[m.group(1) for m in re.finditer(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',h,re.S)][0];\
    # print(base64.b64encode(hashlib.sha256(s.encode()).digest()).decode())"
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-XrE0zs8OuYPdzWEbDDHIaEvirBF9nRETnPjof8QBY+U='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'; form-action 'self'" always;

    access_log /var/log/nginx/prompt.guanjihuan.com.access.log;
    error_log  /var/log/nginx/prompt.guanjihuan.com.error.log;
}
